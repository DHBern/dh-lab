name: Greetings

# pull_request_target, not pull_request: a pull request opened from a fork
# gets a read-only GITHUB_TOKEN under pull_request, so the action cannot post
# its greeting and the check fails. pull_request_target runs in the context of
# the base repository, where the permissions below can be granted.
#
# This is only safe because the job checks out no code and runs nothing from
# the pull request — it posts a message and nothing else. Do not add a checkout
# step here.

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Hi there! Thanks for opening your first issue!'
          pr-message: 'Hi there! Thanks for opening your first pull request!'
